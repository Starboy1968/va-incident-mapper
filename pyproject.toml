[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "va-incident-mapper"
version = "1.0.1"
description = "Log cyber incidents and map them to Virginia and federal statutes. Educational tool, not legal advice."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Starboy1968" }]
keywords = ["incident-response", "cybercrime", "virginia", "legal-tech", "evidence"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
]

[project.scripts]
va-incident-mapper = "va_incident_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
va_incident_mapper = ["data/*.json"]

[project.urls]
Homepage = "https://github.com/Starboy1968/va-incident-mapper"
Issues = "https://github.com/Starboy1968/va-incident-mapper/issues"
